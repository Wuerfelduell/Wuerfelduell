          CSS

          cat > scripts/validate-pro.mjs <<'VALIDATOR'
          import fs from 'node:fs';
          const read=p=>fs.readFileSync(p,'utf8');
          const fail=m=>{console.error(`❌ Pro validator: ${m}`);process.exitCode=1;};
          const js=read('js/38-pro.js');
          const html=read('index.html');
          const css=read('css/pro.css');
          if(!js.includes("const VERSION = '28.10.0'"))fail('module version missing');
          if(!js.includes('diceduel_pro_monthly')||!js.includes('diceduel_pro_yearly'))fail('store product IDs missing');
          if(!js.includes('TRUSTED_SOURCES')||!js.includes('verified === true'))fail('trusted entitlement verification missing');
          if(/localStorage\.(?:getItem|setItem)\([^)]*(?:entitlement|isPro|hasPro)/i.test(js))fail('entitlement must not use LocalStorage');
          if(/URLSearchParams|location\.(?:search|hash).*pro/i.test(js))fail('URL must not grant Pro');
          for(const feature of ['Battle Vault','Kampfarchiv','Boss Rush chronicle','5 loadout slots','Premium themes','Profile auras'])if(!js.includes(feature))fail(`feature text missing: ${feature}`);
          if(!html.includes('css/pro.css?v=28.10.0'))fail('Pro CSS not loaded');
          if(!html.includes('js/38-pro.js?v=28.10.0'))fail('Pro JS not loaded');
          if(css.length<5000)fail('Pro CSS unexpectedly small');
          if(/(?:isPro|hasPro|proEntitlement).{0,100}(?:damage|health|\bhp\b|dice.?chance|attack.?bonus|ability.?power|enemy.?hp)/i.test(js))fail('potential pay-to-win hook');
          if(!process.exitCode)console.log('✅ DiceDuel Pro validator passed.');
          VALIDATOR

          cat > docs/PRO_BILLING_INTEGRATION.md <<'DOC'
          # DiceDuel Pro billing bridge

          The web client never trusts a save file, LocalStorage value, URL parameter, or imported profile as proof of subscription.

          A native/store layer must expose `window.DiceDuelBilling` (or `window.WD_BILLING_PROVIDER`) with:

          ```js
          {
            async getEntitlement({ productIds, feature }) {
              return {
                active: true,
                verified: true,
                source: "google-play", // or app-store / stripe-backend / firebase-functions / server
                productId: "diceduel_pro_yearly",
                expiresAt: "2027-09-02T00:00:00.000Z"
              };
            },
            async purchase({ productId }) { /* launch native purchase and verify server-side */ },
            async restore({ productIds }) { /* restore and verify receipts server-side */ }
          }
          ```

          `verified: true` must only be returned after receipt/token verification through a trusted backend or an equally trusted native provider. Do not implement this flag from client-owned storage.

          Product IDs:

          - `diceduel_pro_monthly`
          - `diceduel_pro_yearly`

          Pro unlocks analytics, local history, loadouts, themes, and profile cosmetics. It must not modify HP, damage, dice odds, abilities, enemy values, campaign access, or matchmaking power.
          DOC

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          v='28.10.0'
          index=Path('index.html')
          text=index.read_text()
          # Update current build query strings without rewriting historical prose.
          text=re.sub(r'([?&]v=)28\.9\.2\b',r'\g<1>'+v,text)
          text=re.sub(r'([?&]v=)28\.9\.1\b',r'\g<1>'+v,text)
          if 'css/pro.css?' not in text:
              text=text.replace('</head>',f'  <link rel="stylesheet" href="css/pro.css?v={v}">\n</head>')
          if 'js/38-pro.js?' not in text:
              text=text.replace('</body>',f'  <script src="js/38-pro.js?v={v}"></script>\n</body>')
          index.write_text(text)

          for name in ('package.json','package-lock.json'):
              p=Path(name)
              if not p.exists(): continue
              try:
                  obj=json.loads(p.read_text())
              except Exception: continue
              obj['version']=v
              if name=='package-lock.json':
                  if isinstance(obj.get('packages'),dict) and isinstance(obj['packages'].get(''),dict): obj['packages']['']['version']=v
              if name=='package.json':
                  scripts=obj.setdefault('scripts',{})
                  scripts['check:pro']='node scripts/validate-pro.mjs'
                  check=scripts.get('check','')
                  if 'validate-pro.mjs' not in check:
                      scripts['check']=(check+' && ' if check else '')+'node scripts/validate-pro.mjs'
              p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')

          p=Path('version.json')
          if p.exists():
              try:
                  obj=json.loads(p.read_text())
                  if isinstance(obj,dict):
                      for key in ('version','build','appVersion'):
                          if key in obj: obj[key]=v
                      if not any(k in obj for k in ('version','build','appVersion')): obj['version']=v
                      p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
              except Exception:
                  p.write_text(json.dumps({'version':v},indent=2)+'\n')

          for name in ('sw.js','js/01-config.js'):
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r'(?<=GAME_VERSION\s=\s["\'])28\.9\.2(?=["\'])',v,s)
              s=re.sub(r'(?<=CACHE_VERSION\s=\s["\'])28\.9\.2(?=["\'])',v,s)
              s=re.sub(r'(?<=GAME_VERSION\s=\s["\'])28\.9\.1(?=["\'])',v,s)
              s=re.sub(r'(?<=CACHE_VERSION\s=\s["\'])28\.9\.1(?=["\'])',v,s)
              p.write_text(s)
          PY

      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pro-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Transferred Pro implementation already present; bootstrap removed without product changes.'
          else
            git commit -m 'feat: add DiceDuel Pro foundation (V28.10.0)'
            git push origin HEAD:codex/v28.10.0-pro
          fi
