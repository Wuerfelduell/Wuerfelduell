<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DiceDuel World Assets QA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:16px;background:#182539;color:#f5e8c9;font-family:system-ui,sans-serif}
    h1{margin:0 0 14px;font-size:20px}
    .qa-grid{display:grid;gap:22px}
    .qa-case{min-width:0}
    .qa-case>h2{margin:0 0 7px;font-size:14px}
    iframe{display:block;max-width:none;border:1px solid #61758f;background:#dce8f4;box-shadow:0 10px 24px rgba(0,0,0,.28)}
  </style>
</head>
<body>
  <h1>V28 World Assets · responsive QA</h1>
  <main class="qa-grid" id="qaGrid"></main>
  <script>
    const ROOT="https://wuerfelduell.github.io/Wuerfelduell/";
    const THEMES={
      house:["solo-house","#d5a642","#fff0b5","#17365b","rgba(213,166,66,.28)"],
      rift:["solo-rift","#2b83e6","#9de8ff","#092f69","rgba(43,131,230,.30)"],
      zero:["solo-zero","#9fc9e8","#f6fdff","#26465f","rgba(159,201,232,.28)"],
      covenant:["duo-covenant","#356fc4","#e7c66e","#102e59","rgba(53,111,196,.29)"]
    };
    function worldVars(theme){
      const [stem,primary,secondary,surface,glow]=theme;
      const path=`${ROOT}assets/ui/v28/png/worlds/world-${stem}`;
      return [
        `--world-primary:${primary}`,
        `--world-secondary:${secondary}`,
        `--world-surface:${surface}`,
        `--world-glow:${glow}`,
        `--world-emblem:url(${path}.webp?v=28.11.1)`,
        `--world-frame-round:url(${path}-frame.webp?v=28.11.1)`,
        `--world-frame-rect:url(${path}-frame-rect.webp?v=28.11.1)`
      ].join(";");
    }
    function fixture(){
      return `<!doctype html>
<html lang="de" data-v28-rework="2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="${ROOT}">
  <link rel="stylesheet" href="${ROOT}css/app.css?qa=779c805">
  <style>
    body{margin:0!important;padding:9px!important;background:#dce8f4!important;overflow-x:hidden!important;overflow-y:auto!important;font-family:system-ui,sans-serif!important}
    .qa-label{margin:12px 0 5px;color:#17365b;font-size:11px;font-weight:950;letter-spacing:.07em;text-transform:uppercase}
    .campaign-hub{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:10px!important;overflow:hidden!important;background:#fff8ea!important}
    .campaign-world-tabs{display:flex!important;overflow-x:auto!important}
    .boss-zone{margin-top:14px;padding:10px;background:#06172f;color:#fff}
    .boss-zone .qa-label{color:#f3cf77}
    #game{display:block!important;position:static!important;min-height:0!important;height:auto!important;background:transparent!important}
    #players{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
    #players .player{display:block!important;position:relative!important;min-width:0!important;min-height:128px!important}
    .encounter-rule-banner{display:block!important;margin:0 0 10px!important}
  </style>
</head>
<body class="playing">
  <div id="campaignScreen" class="campaign-hub" data-world-theme="solo-rift" style="${worldVars(THEMES.rift)}">
    <div class="qa-label">Welt-Tabs · abgeschlossen / aktiv / gesperrt</div>
    <div class="campaign-world-tabs">
      <button type="button" class="campaign-world-btn done" data-world-theme="solo-house" style="${worldVars(THEMES.house)}">
        <span class="campaign-world-kicker">W1</span><span class="campaign-world-art" aria-hidden="true"></span>
        <span class="campaign-world-copy"><span class="campaign-world-name">House</span><span class="campaign-world-state">✓</span></span>
      </button>
      <button type="button" class="campaign-world-btn active" data-world-theme="solo-rift" style="${worldVars(THEMES.rift)}">
        <span class="campaign-world-kicker">W2</span><span class="campaign-world-art" aria-hidden="true"></span>
        <span class="campaign-world-copy"><span class="campaign-world-name">Rift</span><span class="campaign-world-state">15/15</span></span>
      </button>
      <button type="button" class="campaign-world-btn" data-world-theme="solo-zero" disabled style="${worldVars(THEMES.zero)}">
        <span class="campaign-world-kicker">W3</span><span class="campaign-world-art" aria-hidden="true"></span>
        <span class="campaign-world-copy"><span class="campaign-world-name">Zero</span><span class="campaign-world-state">🔒</span></span>
      </button>
    </div>

    <div class="qa-label">Weltbanner</div>
    <div class="campaign-world-desc">
      <span class="campaign-world-banner-art" aria-hidden="true"></span>
      <span class="campaign-world-banner-copy"><span class="campaign-world-banner-kicker">Welt 2 · 15/15 Encounter</span><strong>Rift</strong><span class="campaign-world-banner-desc">Eine zerrissene Welt mit instabilen Portalen. Beide Spieler müssen häufiger dieselbe Route direkt nacheinander übergeben.</span></span>
    </div>

    <div class="qa-label">Encounter-Detailkopf</div>
    <div class="campaign-node-detail" data-p4-detail-tone="boss">
      <div class="node-detail-head">
        <div><div class="node-detail-title">15 · Rift Sovereign – Herzbruch</div><div class="node-detail-sub">Fokus-Pässe</div></div>
        <div class="node-detail-state" data-campaign-state="completed" aria-label="GESCHAFFT"><img src="${ROOT}assets/ui/v28/svg/gameplay/completed.svg" class="dd-inline-icon" alt="" aria-hidden="true">GESCHAFFT</div>
      </div>
      <div class="node-detail-desc">Der Rift Sovereign muss zuletzt fallen. Der Beschreibungstext bleibt vollständig sichtbar.</div>
      <div class="node-detail-row"><strong>Challenge:</strong>&nbsp; Erzeugt mindestens vier Fokus-Pässe.</div>
    </div>
  </div>

  <section class="boss-zone">
    <div class="qa-label">Boss Rush · Runde 1</div>
    <div id="encounterRuleBanner" class="encounter-rule-banner">
      <strong class="boss-rush-live boss-rush-status-items" aria-label="Boss Rush, Stufe 1 von 10, Boss Covenant King, Phase 1, 0 Boss XP je Profil">
        <span class="boss-rush-status-item"><small>Stufe</small><b>1 / 10</b></span>
        <span class="boss-rush-status-item"><small>Boss</small><b>Covenant King</b></span>
        <span class="boss-rush-status-item"><small>Phase</small><b>1 · 50 % → RUSH OVERDRIVE 1</b></span>
        <span class="boss-rush-status-item"><small>XP</small><b>0 je Profil</b></span>
      </strong>
      <span class="phase-live" data-boss-rush-legacy-phase="1" aria-hidden="true">Phase 1 · Nächster Übergang</span>
    </div>
    <div id="game" class="boss-rush-game"><div id="players">
      <div class="player active"><div class="player-name"><span class="player-name-text">Seb</span></div><div class="hp">❤️ <strong>40</strong> / 40</div><div class="ability-tag">⚡ Glückswurf</div></div>
      <div class="player boss-rush-world-enemy" data-world-theme="duo-covenant" data-boss-rush-stage="1" style="${worldVars(THEMES.covenant)}"><div class="player-name"><span class="player-name-text">Covenant King – Ungebrochener Herrscher</span></div><div class="hp">❤️ <strong>50</strong> / 50</div><div class="ability-tag">⚡ High Stakes</div><div class="ability-tag second">✦ Counterattack</div></div>
    </div></div>
  </section>
</body>
</html>`;
    }

    const grid=document.getElementById("qaGrid");
    [320,360,390,412,1280].forEach(width=>{
      const section=document.createElement("section");
      section.className="qa-case";
      section.innerHTML=`<h2>${width}px</h2>`;
      const frame=document.createElement("iframe");
      frame.title=`DiceDuel ${width}px`;
      frame.width=width;
      frame.height=1900;
      frame.srcdoc=fixture();
      section.append(frame);
      grid.append(section);
    });
  </script>
</body>
</html>
