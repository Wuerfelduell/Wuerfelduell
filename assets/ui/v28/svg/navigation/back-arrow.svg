<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Back Arrow">
  <title>Back Arrow</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4bf"/>
      <stop offset="0.22" stop-color="#f6d679"/>
      <stop offset="0.52" stop-color="#c98a26"/>
      <stop offset="0.78" stop-color="#ffe59a"/>
      <stop offset="1" stop-color="#9a5d16"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d76d9"/>
      <stop offset="0.5" stop-color="#104a97"/>
      <stop offset="1" stop-color="#071f4b"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#eadcbd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.25" flood-color="#06152e" flood-opacity="0.58"/>
    </filter>
  </defs><style>
    .s{fill:none;stroke:url(#gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .t{fill:none;stroke:url(#gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .f{fill:url(#gold);stroke:#6f4314;stroke-width:1.2;stroke-linejoin:round}
    .n{fill:url(#blue);stroke:url(#gold);stroke-width:2.2;stroke-linejoin:round}
    .i{fill:url(#ivory);stroke:url(#gold);stroke-width:2.2;stroke-linejoin:round}
    .b{fill:#27a9ff;stroke:#d8f6ff;stroke-width:1}
  </style>
  <g filter="url(#shadow)"><circle class="n" cx="32" cy="32" r="25"/><path class="s" stroke-width="4" d="M38 17 23 32l15 15M24 32h22"/></g>
</svg>
