    .guard{fill:url(#gold);stroke:#6f4314;stroke-width:1.1;stroke-linejoin:round}
    .grip{fill:url(#blue);stroke:url(#gold);stroke-width:1.3;stroke-linejoin:round}
    .pommel{fill:url(#gold);stroke:#6f4314;stroke-width:1}
  </style>
  <g filter="url(#shadow)">
