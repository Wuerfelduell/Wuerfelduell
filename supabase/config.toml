project_id = "diceduel"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["https://wuerfelduell.github.io/Wuerfelduell/"]
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[realtime]
enabled = true

[functions.battle-action]
verify_jwt = false
